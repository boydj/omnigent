[project]
name = "ledger"
version = "0.3.0"
description = "Import bank CSV exports, categorize transactions, and report monthly spending."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ledger = "ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
