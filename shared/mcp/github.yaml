# GitHub MCP server (official github/github-mcp-server, run locally).
#
# Source of truth, shared by every agent: scripts/sync-shared.sh copies it to
# agents/*/tools/mcp/. Edit it here, never the copies.
# Omnigent auto-discovers every tools/mcp/*.yaml next to the agent's
# config.yaml; nothing needs to reference this file.
#
# No token or ${VAR} here on purpose: `omnigent run` / `omnigent agent add`
# resolve ${VAR} from your shell INTO the uploaded agent bundle, which would
# copy the token into Omnigent's database. The wrapper fetches it at launch.
# Toolsets, read-only and lockdown mode are set in ~/.config/harness/harness.env.
name: github
description: >-
  GitHub repositories, issues, pull requests, Actions runs and users, through
  the official GitHub MCP server.
transport: stdio
# Launched by Omnigent's runner with a minimal environment (only HOME, PATH,
# USER, LOGNAME, SHELL, TERM), and PATH may not include ~/.local/bin when the
# desktop app or a service started Omnigent. So don't rely on PATH: let the
# shell expand $HOME at launch (Omnigent never expands `command`/`args`).
command: /bin/sh
args: ["-c", 'exec "$HOME/.local/bin/mcp-github"']
