# Jira Cloud MCP server (sooperset/mcp-atlassian, Jira tools only, run locally).
#
# Source of truth, shared by every agent: scripts/sync-shared.sh copies it to
# agents/*/tools/mcp/. Edit it here, never the copies.
# Omnigent auto-discovers every tools/mcp/*.yaml next to the agent's
# config.yaml; nothing needs to reference this file.
#
# No token or ${VAR} here on purpose (see github.yaml). Site URL, account
# email, toolsets, project filter and read-only mode are set in
# ~/.config/harness/harness.env.
name: jira
description: >-
  Jira Cloud issues, comments, transitions, boards and sprints, through the
  mcp-atlassian server.
transport: stdio
# Launched by Omnigent's runner with a minimal environment (only HOME, PATH,
# USER, LOGNAME, SHELL, TERM), and PATH may not include ~/.local/bin when the
# desktop app or a service started Omnigent. So don't rely on PATH: let the
# shell expand $HOME at launch (Omnigent never expands `command`/`args`).
command: /bin/sh
args: ["-c", 'exec "$HOME/.local/bin/mcp-jira"']
